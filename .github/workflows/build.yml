
name: Build FrittyDialogue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrittyDialogue-4.0.0
          path: target/FrittyDialogue.jar
          if-no-files-found: error

      - name: Publish direct JAR download in GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: FrittyDialogue 4.0.0 - Latest build
          body: Automatically updated latest compiled JAR.
          files: target/FrittyDialogue.jar
          make_latest: true
          fail_on_unmatched_files: true
          
